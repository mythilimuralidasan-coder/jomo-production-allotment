<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOMO. Production Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#152238;
    --panel:#1b2c46;
    --panel-2:#223455;
    --panel-3:#28405f;
    --line:rgba(217,168,76,0.22);
    --line-soft:rgba(255,255,255,0.1);
    --gold:#d9a84c;
    --gold-light:#ecc57a;
    --cream:#ffffff;
    --muted:#8ba0bd;
    --pending:#7189ab;
    --progress:#d9a84c;
    --complete:#ffffff;
    --danger:#e0a374;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  button{font-family:'Poppins',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Poppins',sans-serif;}
  ::selection{background:var(--gold);color:#0f1a2c;}

  /* ---------- Auth screens ---------- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 32px;}
  .brand{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;}
  .brand .wordmark{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:34px;color:var(--gold);letter-spacing:0.5px;}
  .logo-img{height:46px;width:auto;filter:brightness(0) invert(1);display:block;}
  .logo-img-sm{height:28px;width:auto;filter:brightness(0) invert(1);display:block;}
  .brand .sub{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:2px;}
  .brand .tag{margin-top:14px;font-size:13px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
  label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;}
  .field{width:100%;background:#0f1a2c;border:1px solid var(--line);border-radius:9px;padding:12px 14px;color:var(--cream);font-size:14px;outline:none;transition:border-color .15s;}
  .field:focus{border-color:var(--gold);}
  .field::placeholder{color:#5c7290;}
  textarea.field{resize:vertical;min-height:80px;}
  .primary-btn{width:100%;margin-top:24px;background:var(--gold);color:#152238;border:none;border-radius:9px;padding:13px;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;transition:background .15s;}
  .primary-btn:hover{background:var(--gold-light);}
  .switch-line{text-align:center;margin-top:18px;font-size:13px;color:var(--muted);}
  .switch-line a{color:var(--gold);text-decoration:none;font-weight:600;cursor:pointer;}
  .error-msg{background:rgba(217,168,76,0.12);border:1px solid var(--danger);color:var(--gold-light);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:14px;display:none;}
  .remember-row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--muted);}
  .remember-row input{accent-color:var(--gold);}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;flex-direction:column;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--line);}
  header.topbar .brand-mini{display:flex;align-items:baseline;gap:10px;}
  header.topbar .wordmark{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:var(--gold);}
  header.topbar .sub{font-size:11px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;}
  .user-block{display:flex;align-items:center;gap:12px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#152238;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;}
  .user-name{font-size:13.5px;}
  .user-email{font-size:11px;color:var(--muted);}
  .ghost-btn{background:transparent;border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:8px 14px;font-size:12.5px;white-space:nowrap;}
  .ghost-btn:hover{border-color:var(--gold);color:var(--gold);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px 4px;flex-wrap:wrap;gap:10px;}
  .toolbar h1{font-size:22px;margin:0;font-weight:700;color:var(--cream);}
  .toolbar .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .gold-btn{background:var(--gold);color:#152238;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:13px;}
  .gold-btn:hover{background:var(--gold-light);}

  /* ---------- Stats strip ---------- */
  .stats-strip{display:flex;gap:14px;padding:16px 28px 0;flex-wrap:wrap;}
  .stat-card{flex:1 1 160px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .stat-card .stat-num{font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:700;color:var(--gold);}
  .stat-card .stat-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px;}

  /* ---------- Filter bar ---------- */
  .filter-bar{display:flex;align-items:center;gap:10px;padding:14px 28px 0;flex-wrap:wrap;}
  .filter-bar input[type=text]{width:220px;}
  .filter-bar select{background:#0f1a2c;border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:9px 10px;font-size:12.5px;outline:none;}
  .filter-bar input.field{padding:9px 12px;font-size:12.5px;}
  .toggle-chip{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 14px;cursor:pointer;user-select:none;}
  .toggle-chip input{accent-color:var(--gold);}
  .toggle-chip.active{color:var(--gold);border-color:var(--gold);}

  .board-scroll{flex:1;overflow-x:auto;padding:14px 28px 32px;}
  .board{display:flex;gap:16px;min-height:60vh;}
  .stage-col{flex:0 0 280px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 250px);transition:border-color .15s,background .15s;}
  .stage-col.drag-over{border-color:var(--gold);background:var(--panel-3);}
  .stage-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);}
  .stage-head .num{font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:600;}
  .stage-head .name{font-size:14.5px;font-weight:600;margin-top:3px;color:var(--cream);}
  .stage-head .count{font-size:11px;color:var(--muted);margin-top:2px;}
  .stage-body{padding:12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px;}
  .stage-body::-webkit-scrollbar{width:6px;}
  .stage-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .job-card{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:grab;transition:border-color .15s,transform .1s;}
  .job-card:active{cursor:grabbing;}
  .job-card.dragging{opacity:0.4;}
  .job-card.overdue{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .job-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px;}
  .job-title{font-weight:600;font-size:14px;color:var(--cream);}
  .expand-btn{background:none;border:none;color:var(--muted);font-size:15px;padding:0 2px;flex:none;}
  .expand-btn:hover{color:var(--gold);}

  .progress-track{display:flex;gap:3px;margin:6px 0 10px;}
  .progress-seg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.14);}
  .progress-seg.filled{background:var(--gold);}
  .progress-seg.current{background:var(--gold-light);}

  .row-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:8px 0 4px;}
  select.mini{width:100%;background:#0f1a2c;border:1px solid var(--line);color:var(--cream);border-radius:7px;padding:7px 8px;font-size:12.5px;outline:none;}
  select.mini:focus{border-color:var(--gold);}
  .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.4px;}
  .status-Pending{background:rgba(113,137,171,0.22);color:var(--pending);}
  .status-In-Progress{background:rgba(217,168,76,0.2);color:var(--progress);}
  .status-Completed{background:rgba(255,255,255,0.16);color:var(--complete);}
  .detail-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);}
  .detail-row input[type=checkbox]{accent-color:var(--gold);}
  .checklist-line{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--cream);margin-top:5px;}
  .advance-btn{margin-top:10px;width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:7px;padding:7px;font-size:12px;font-weight:600;}
  .advance-btn:hover{background:var(--gold);color:#152238;}
  .advance-btn:disabled{opacity:0.3;border-color:var(--muted);color:var(--muted);cursor:not-allowed;}
  .done-badge{margin-top:10px;text-align:center;font-size:12px;color:var(--complete);font-weight:600;}
  .empty-col{padding:20px 4px;text-align:center;color:var(--muted);font-size:12px;}
  .meta-line{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .meta-line .warn{color:var(--gold);font-weight:600;}

  .board-empty{width:100%;text-align:center;padding:80px 20px;color:var(--muted);}
  .board-empty h2{color:var(--cream);font-size:22px;margin-bottom:8px;}
  .board-empty p{font-size:13.5px;margin-bottom:20px;}

  /* ---------- Modal ---------- */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(9,15,26,0.65);align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:380px;max-height:88vh;overflow-y:auto;}
  .modal.wide{max-width:460px;}
  .modal h3{margin:0 0 4px;font-size:18px;color:var(--cream);}
  .modal .close{float:right;background:none;border:none;color:var(--muted);font-size:18px;}
  .team-list{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;}
  .team-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;}
  .team-row button{background:none;border:none;color:var(--danger);font-size:12px;}
  .add-team-row{display:flex;gap:8px;margin-top:12px;}
  .add-team-row input{flex:1;}
  .add-team-row button{background:var(--gold);color:#152238;border:none;border-radius:7px;padding:0 14px;font-weight:600;font-size:13px;}

  .activity-log{margin-top:8px;display:flex;flex-direction:column;gap:8px;max-height:160px;overflow-y:auto;padding-right:4px;}
  .activity-item{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;}
  .activity-item .time{color:var(--gold);font-size:10.5px;display:block;margin-bottom:2px;letter-spacing:0.5px;}
  .modal-footer-row{display:flex;gap:10px;margin-top:22px;}
  .modal-footer-row .primary-btn{margin-top:0;}
  .delete-btn{width:100%;background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:9px;padding:12px;font-weight:600;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;}
  .delete-btn:hover{background:var(--danger);color:#152238;}

  @media (max-width:640px){
    header.topbar{padding:12px 16px;}
    .toolbar{padding:16px 16px 4px;}
    .stats-strip{padding:14px 16px 0;}
    .filter-bar{padding:12px 16px 0;}
    .board-scroll{padding:12px 16px 24px;}
    .filter-bar input[type=text]{width:100%;}
  }
</style>
</head>

    <div class="user-block">

  <div class="toolbar">
    <h1>Production Board</h1>
    <div class="actions">
      <button class="ghost-btn" onclick="exportCSV()">Export CSV</button>
      <button class="ghost-btn" onclick="openTeamModal()">Manage Team</button>

      <option>In Progress</option>
      <option>Completed</option>
    </select>

      <input type="checkbox" id="myJobsToggle" onchange="toggleMyJobs()">

    <div class="board" id="board"></div>
  </div>
</div>

<!-- ================= NEW JOB MODAL ================= -->
<div class="modal-overlay" id="newJobOverlay">
  <div class="modal">
    <button class="close" onclick="closeModal('newJobOverlay')">✕</button>
    <h3>New Production Job</h3>
    <label>Client / Project Name</label>
    <input class="field" id="newJobName" placeholder="e.g. Mr. Suraj — Modular Kitchen">
    <label>Due Date (optional)</label>
    <input class="field" id="newJobDue" type="date">
    <button class="primary-btn" onclick="createJob()">Add to Pipeline</button>
  </div>
</div>

<!-- ================= TEAM MODAL ================= -->
<div class="modal-overlay" id="teamOverlay">
  <div class="modal">
    <button class="close" onclick="closeModal('teamOverlay')">✕</button>
    <h3>Production Team</h3>
    <div class="team-list" id="teamList"></div>
    <div class="add-team-row">
      <input class="field" id="newMemberName" placeholder="Add team member">
      <button onclick="addTeamMember()">Add</button>
    </div>
  </div>
</div>

<!-- ================= JOB DETAIL MODAL ================= -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal wide">
    <button class="close" onclick="closeModal('detailOverlay')">✕</button>
    <h3 id="detailTitle">Job</h3>
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px;" id="detailStage"></div>

    <label>Assigned By (Production Head)</label>
    <select class="field" id="detailAssignedBy" onchange="saveDetailField('assignedBy', this.value)"></select>

    <label>Due Date</label>
    <input class="field" id="detailDue" type="date" onchange="saveDetailField('dueDate', this.value)">

    <label>Notes</label>
    <textarea class="field" id="detailNotes" placeholder="Add notes for this job..." onblur="saveDetailField('notes', this.value)"></textarea>

    <label>Activity Log</label>
    <div class="activity-log" id="activityLog"></div>

    <div class="modal-footer-row">
      <button class="delete-btn" onclick="deleteJob()">Delete Job</button>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------
   NOTE ON THIS PROTOTYPE
   Users and jobs are kept in this browser's localStorage so the
   flow (login, assignment, status, pipeline movement) works and
   feels real as a standalone, deployable site. localStorage is
   per-browser: data entered on one device/browser won't show up
   on another. For everyone on the team to see the same live
   board, this needs a real shared backend/database later.
--------------------------------------------------------- */

const STAGES = [
  { key:'material',   name:'Material Availability Check', detail:'material' },
  { key:'assign',      name:'Work Assignment',              detail:'none' },
  { key:'laminate',    name:'Laminate Stock Check',         detail:'laminate' },
  { key:'crosscheck',  name:'Drawing Cross-Check',          detail:'crosscheck' },
  { key:'bom',         name:'BOM Creation',                 detail:'bom' },
  { key:'initiate',    name:'Production Initiate',          detail:'initiate' },
  { key:'optimizer',   name:'Optimizer Run',                detail:'optimizer' },
];

const OVERDUE_HOURS = 48; // how long a job can sit in one stage before it's flagged

let currentUser = null;
let jobs = [];
let team = [];
let detailJobId = null;
let dragJobId = null;
let showMyJobsOnly = false;

function encode(str){ return btoa(unescape(encodeURIComponent(str))); }

const STORAGE_PREFIX = 'jomo_pipeline_';

async function getUsers(){
  try{ const raw = localStorage.getItem(STORAGE_PREFIX + 'users'); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
async function saveUsers(users){ localStorage.setItem(STORAGE_PREFIX + 'users', JSON.stringify(users)); }

async function getJobs(){
  try{ const raw = localStorage.getItem(STORAGE_PREFIX + 'jobs'); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
async function saveJobs(){ localStorage.setItem(STORAGE_PREFIX + 'jobs', JSON.stringify(jobs)); }

async function getTeam(){
  try{ const raw = localStorage.getItem(STORAGE_PREFIX + 'team'); return raw ? JSON.parse(raw) : ['Pritha','Deny']; }
  catch(e){ return ['Pritha','Deny']; }
}
async function saveTeam(){ localStorage.setItem(STORAGE_PREFIX + 'team', JSON.stringify(team)); }

async function getSession(){
  try{ return localStorage.getItem(STORAGE_PREFIX + 'session'); }
  catch(e){ return null; }
}
async function setSession(email){ localStorage.setItem(STORAGE_PREFIX + 'session', email); }
async function clearSession(){ try{ localStorage.removeItem(STORAGE_PREFIX + 'session'); }catch(e){} }

function storageIsBlocked(){
  try{
    const testKey = STORAGE_PREFIX + '__test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return false;
  }catch(e){
    return true;
  }
}

function checkStorageOrWarn(errorElId){
  if(storageIsBlocked()){
    showError(errorElId, "This browser is blocking storage for this page (common when a file is opened directly instead of through a web address, e.g. file:// links, or with cookies/site data disabled). Try opening it from its actual web link instead, or use Chrome with site data allowed.");
    return true;
  }
  return false;
}

function showSignup(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('signupScreen').style.display='flex'; }
function showLogin(){ document.getElementById('signupScreen').style.display='none'; document.getElementById('loginScreen').style.display='flex'; }

function showError(id, msg){ const el = document.getElementById(id); el.textContent = msg; el.style.display='block'; }
function hideError(id){ document.getElementById(id).style.display='none'; }

async function handleSignup(){
  hideError('signupError');
  if(checkStorageOrWarn('signupError')) return;
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim().toLowerCase();
  const pw = document.getElementById('signupPassword').value;
  const confirm = document.getElementById('signupConfirm').value;
  if(!name || !email || !pw){ showError('signupError','Please fill in every field.'); return; }
  if(pw !== confirm){ showError('signupError','Passwords don\'t match.'); return; }
  try{
    const users = await getUsers();
    if(users[email]){ showError('signupError','An account with this email already exists.'); return; }
    users[email] = { name, password: encode(pw) };
    await saveUsers(users);
    await setSession(email);
    await enterApp(email, name);
  }catch(e){
    showError('signupError', 'Could not create the account in this browser: ' + e.message);
  }
}

async function handleLogin(){
  hideError('loginError');
  if(checkStorageOrWarn('loginError')) return;
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pw = document.getElementById('loginPassword').value;
  if(!email || !pw){ showError('loginError','Enter your email and password.'); return; }
  try{
    const users = await getUsers();
    const record = users[email];
    if(!record || record.password !== encode(pw)){ showError('loginError','Incorrect email or password.'); return; }
    const remember = document.getElementById('rememberMe').checked;
    if(remember){ await setSession(email); }
    await enterApp(email, record.name);
  }catch(e){
    showError('loginError', 'Could not log in from this browser: ' + e.message);
  }
}

async function enterApp(email, name){
  currentUser = { email, name };
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('signupScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();
  document.getElementById('userNameLabel').textContent = name;
  document.getElementById('userEmailLabel').textContent = email;
  team = await getTeam();
  jobs = await getJobs();
  renderBoard();
}

async function logout(){
  await clearSession();
  currentUser = null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginEmail').value='';
  document.getElementById('loginPassword').value='';
  showLogin();
}

function openModal(id){ document.getElementById(id).style.display='flex'; }
function closeModal(id){ document.getElementById(id).style.display='none'; }

function openNewJobModal(){
  document.getElementById('newJobName').value='';
  document.getElementById('newJobDue').value='';
  openModal('newJobOverlay');
}

function logActivity(job, text){
  if(!job.activity) job.activity = [];
  job.activity.unshift({ ts: Date.now(), text });
  job.activity = job.activity.slice(0, 30);
}

async function createJob(){
  const name = document.getElementById('newJobName').value.trim();
  const due = document.getElementById('newJobDue').value;
  if(!name) return;
  const now = Date.now();
  const job = {
    id: 'job_' + now,
    name,
    stageIndex: 0,
    assignee: '',
    assignedBy: '',
    status: 'Pending',
    fields: {},
    notes: '',
    dueDate: due || '',
    createdAt: now,
    stageEnteredAt: now,
    deliveredAt: null,
    activity: []
  };
  logActivity(job, `Job created${due ? ' — due ' + formatDate(due) : ''}`);
  jobs.push(job);
  await saveJobs();
  closeModal('newJobOverlay');
  renderBoard();
}

function openTeamModal(){ renderTeamList(); openModal('teamOverlay'); }

function renderTeamList(){
  const el = document.getElementById('teamList');
  el.innerHTML = team.map((m,i) => `
    <div class="team-row">
      <span>${m}</span>
      <button onclick="removeTeamMember(${i})">Remove</button>
    </div>`).join('') || '<div class="empty-col">No team members yet.</div>';
}

async function addTeamMember(){
  const input = document.getElementById('newMemberName');
  const val = input.value.trim();
  if(!val) return;
  if(!team.includes(val)) team.push(val);
  await saveTeam();
  input.value='';
  renderTeamList();
  renderBoard();
}

async function removeTeamMember(i){
  team.splice(i,1);
  await saveTeam();
  renderTeamList();
  renderBoard();
}

async function updateJob(id, patch, activityText){
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  Object.assign(job, patch);
  if(activityText) logActivity(job, activityText);
  const lastStage = STAGES.length - 1;
  if(job.stageIndex === lastStage && job.status === 'Completed' && !job.deliveredAt){
    job.deliveredAt = Date.now();
  }
  await saveJobs();
  renderBoard();
}

async function updateJobField(id, fieldKey, value, label){
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  job.fields[fieldKey] = value;
  logActivity(job, label ? `${label}: ${value === true ? 'checked' : value === false ? 'unchecked' : value}` : 'Updated a checklist item');
  await saveJobs();
  renderBoard();
}

async function advanceJob(id){
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  if(job.stageIndex < STAGES.length - 1){
    const fromName = STAGES[job.stageIndex].name;
    job.stageIndex += 1;
    job.status = 'Pending';
    job.stageEnteredAt = Date.now();
    logActivity(job, `Moved from "${fromName}" to "${STAGES[job.stageIndex].name}"`);
  }
  await saveJobs();
  renderBoard();
}

async function moveJobToStage(id, stageIndex){
  const job = jobs.find(j => j.id === id);
  if(!job || job.stageIndex === stageIndex) return;
  const fromName = STAGES[job.stageIndex].name;
  job.stageIndex = stageIndex;
  job.status = 'Pending';
  job.stageEnteredAt = Date.now();
  logActivity(job, `Moved from "${fromName}" to "${STAGES[stageIndex].name}" (drag)`);
  await saveJobs();
  renderBoard();
}

function statusClass(s){ return 'status-' + s.replace(' ','-'); }

function formatDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
}

function daysInStage(job){
  const ms = Date.now() - (job.stageEnteredAt || job.createdAt || Date.now());
  return ms / (1000*60*60*24);
}

function isOverdue(job){
  const hoursInStage = (Date.now() - (job.stageEnteredAt || job.createdAt || Date.now())) / (1000*60*60);
  const stageOverdue = hoursInStage > OVERDUE_HOURS && job.status !== 'Completed';
  const dateOverdue = job.dueDate && !job.deliveredAt && new Date(job.dueDate + 'T23:59:59') < new Date();
  return stageOverdue || dateOverdue;
}

function detailControl(job, stage){
  const f = job.fields;
  switch(stage.detail){
    case 'material':
      return `<div class="row-label">Material Status</div>
        <select class="mini" onchange="updateJobField('${job.id}','materialStatus', this.value, 'Material Status')">
          <option ${!f.materialStatus?'selected disabled':''} hidden>Select status</option>
          <option ${f.materialStatus==='Available'?'selected':''}>Available</option>
          <option ${f.materialStatus==='Not Available'?'selected':''}>Not Available</option>
        </select>`;
    case 'laminate':
      return `<div class="row-label">Laminate Stock</div>
        <select class="mini" onchange="updateJobField('${job.id}','laminateStock', this.value, 'Laminate Stock')">
          <option ${!f.laminateStock?'selected disabled':''} hidden>Select stock status</option>
          <option ${f.laminateStock==='In Stock'?'selected':''}>In Stock</option>
          <option ${f.laminateStock==='Out of Stock'?'selected':''}>Out of Stock</option>
        </select>`;
    case 'crosscheck':
      return `<div class="detail-row">
          <input type="checkbox" ${f.siteVerified?'checked':''} onchange="updateJobField('${job.id}','siteVerified', this.checked, 'Site verification')">
          <span>Drawing matches site check</span>
        </div>`;
    case 'bom':
      return ['sizeCheck1','sizeCheck2','sizeCheck3'].map((k,i) => `
        <div class="checklist-line">
          <input type="checkbox" ${f[k]?'checked':''} onchange="updateJobField('${job.id}','${k}', this.checked, 'Size & quantity verification — pass ${i+1}')">
          <span>Size &amp; quantity verification — pass ${i+1}</span>
        </div>`).join('');
    case 'initiate':
      return `<div class="detail-row">
          <input type="checkbox" ${f.approved?'checked':''} onchange="updateJobField('${job.id}','approved', this.checked, 'BOM approval')">
          <span>BOM approved — cleared to initiate</span>
        </div>`;
    case 'optimizer':
      return `<div class="detail-row">
          <input type="checkbox" ${f.optimized?'checked':''} onchange="updateJobField('${job.id}','optimized', this.checked, 'Optimizer run')">
          <span>Cutting list run through optimizer</span>
        </div>`;
    default:
      return '';
  }
}

function progressTrack(job){
  return `<div class="progress-track">${STAGES.map((s,i) => {
    let cls = 'progress-seg';
    if(i < job.stageIndex) cls += ' filled';
    else if(i === job.stageIndex) cls += ' filled current';
    return `<div class="${cls}"></div>`;
  }).join('')}</div>`;
}

function populateFilterOptions(){
  const sel = document.getElementById('assigneeFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="">All assignees</option>' + team.map(m => `<option ${current===m?'selected':''}>${m}</option>`).join('');
}

function toggleMyJobs(){
  showMyJobsOnly = document.getElementById('myJobsToggle').checked;
  document.getElementById('myJobsChip').classList.toggle('active', showMyJobsOnly);
  renderBoard();
}

function passesFilters(job){
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const assigneeFilter = document.getElementById('assigneeFilter').value;
  const statusFilter = document.getElementById('statusFilter').value;
  if(search && !job.name.toLowerCase().includes(search)) return false;
  if(statusFilter && job.status !== statusFilter) return false;
  if(showMyJobsOnly){
    if(!currentUser || (job.assignee || '').trim().toLowerCase() !== currentUser.name.trim().toLowerCase()) return false;
  } else if(assigneeFilter && job.assignee !== assigneeFilter){
    return false;
  }
  return true;
}

function renderStats(){
  const el = document.getElementById('statsStrip');
  const total = jobs.length;
  const lastStage = STAGES.length - 1;
  const delivered = jobs.filter(j => j.stageIndex === lastStage && j.status === 'Completed');
  const weekAgo = Date.now() - 7*24*60*60*1000;
  const deliveredThisWeek = delivered.filter(j => j.deliveredAt && j.deliveredAt >= weekAgo).length;
  let avgDays = '—';
  if(delivered.length){
    const totalDays = delivered.reduce((sum,j) => sum + ((j.deliveredAt - j.createdAt) / (1000*60*60*24)), 0);
    avgDays = (totalDays / delivered.length).toFixed(1);
  }
  const overdueCount = jobs.filter(isOverdue).length;
  el.innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total Jobs</div></div>
    <div class="stat-card"><div class="stat-num">${delivered.length}</div><div class="stat-label">Delivered</div></div>
    <div class="stat-card"><div class="stat-num">${deliveredThisWeek}</div><div class="stat-label">Delivered This Week</div></div>
    <div class="stat-card"><div class="stat-num">${avgDays}</div><div class="stat-label">Avg. Cycle (Days)</div></div>
    <div class="stat-card"><div class="stat-num">${overdueCount}</div><div class="stat-label">Overdue</div></div>`;
}

function renderBoard(){
  populateFilterOptions();
  renderStats();
  const board = document.getElementById('board');

  if(jobs.length === 0){
    board.innerHTML = `<div class="board-empty">
      <h2>No jobs in the pipeline yet</h2>
      <p>Add your first production job to start tracking it through every stage.</p>
      <button class="gold-btn" onclick="openNewJobModal()">+ New Job</button>
    </div>`;
    return;
  }

  board.innerHTML = STAGES.map((stage, idx) => {
    const stageJobs = jobs.filter(j => j.stageIndex === idx && passesFilters(j));
    const isLast = idx === STAGES.length - 1;
    const cards = stageJobs.map(job => {
      const canAdvance = job.status === 'Completed' && !isLast;
      const teamOptions = ['<option value="" '+(job.assignee?'':'selected disabled')+' hidden>Unassigned</option>']
        .concat(team.map(m => `<option ${job.assignee===m?'selected':''}>${m}</option>`)).join('');
      const overdue = isOverdue(job);
      const dayCount = daysInStage(job);
      const dayLabel = dayCount < 1 ? 'Entered today' : `${Math.floor(dayCount)} day${Math.floor(dayCount)===1?'':'s'} in this stage`;
      return `
        <div class="job-card ${overdue?'overdue':''}" draggable="true"
             ondragstart="onDragStart(event,'${job.id}')" ondragend="onDragEnd(event)">
          <div class="job-card-top">
            <div class="job-title">${job.name}</div>
            <button class="expand-btn" onclick="openDetail('${job.id}')" title="View details">⋯</button>
          </div>
          ${progressTrack(job)}
          <div class="row-label">Assigned To</div>
          <select class="mini" onchange="updateJob('${job.id}', {assignee:this.value}, 'Assigned to ' + this.value)">${teamOptions}</select>
          <div class="row-label">Status</div>
          <select class="mini ${statusClass(job.status)}" onchange="updateJob('${job.id}', {status:this.value}, 'Status changed to ' + this.value)">
            <option ${job.status==='Pending'?'selected':''}>Pending</option>
            <option ${job.status==='In Progress'?'selected':''}>In Progress</option>
            <option ${job.status==='Completed'?'selected':''}>Completed</option>
          </select>
          <span class="status-pill ${statusClass(job.status)}" style="margin-top:8px;display:inline-block;">${job.status}</span>
          ${detailControl(job, stage)}
          <div class="meta-line">
            <span class="${overdue?'warn':''}">${overdue?'⚠ ':''}${dayLabel}</span>
            ${job.dueDate ? `<span class="${overdue && job.dueDate ? 'warn':''}">Due ${formatDate(job.dueDate)}</span>` : ''}
          </div>
          ${isLast && job.status==='Completed'
            ? '<div class="done-badge">✓ Ready for production</div>'
            : `<button class="advance-btn" ${canAdvance?'':'disabled'} onclick="advanceJob('${job.id}')">Move to Next Stage →</button>`}
        </div>`;
    }).join('') || '<div class="empty-col">No jobs at this stage.</div>';

    return `
      <div class="stage-col" data-stage-index="${idx}"
           ondragover="onDragOver(event, ${idx})" ondragleave="onDragLeave(event, ${idx})" ondrop="onDrop(event, ${idx})">
        <div class="stage-head">
          <div class="num">STAGE ${idx+1}</div>
          <div class="name">${stage.name}</div>
          <div class="count">${stageJobs.length} job${stageJobs.length===1?'':'s'}</div>
        </div>
        <div class="stage-body">${cards}</div>
      </div>`;
  }).join('');
}

/* ---------------- drag & drop ---------------- */
function onDragStart(e, id){
  dragJobId = id;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd(e){
  e.target.classList.remove('dragging');
  dragJobId = null;
}
function onDragOver(e, idx){
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e, idx){
  e.currentTarget.classList.remove('drag-over');
}
function onDrop(e, idx){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(dragJobId) moveJobToStage(dragJobId, idx);
}

/* ---------------- job detail modal ---------------- */
function openDetail(id){
  detailJobId = id;
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  document.getElementById('detailTitle').textContent = job.name;
  document.getElementById('detailStage').textContent = `Stage ${job.stageIndex+1} of ${STAGES.length} — ${STAGES[job.stageIndex].name}`;
  const abSel = document.getElementById('detailAssignedBy');
  abSel.innerHTML = '<option value="">Unassigned</option>' + team.map(m => `<option ${job.assignedBy===m?'selected':''}>${m}</option>`).join('');
  document.getElementById('detailDue').value = job.dueDate || '';
  document.getElementById('detailNotes').value = job.notes || '';
  const log = document.getElementById('activityLog');
  log.innerHTML = (job.activity && job.activity.length)
    ? job.activity.map(a => `<div class="activity-item"><span class="time">${new Date(a.ts).toLocaleString('en-IN', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>${a.text}</div>`).join('')
    : '<div class="activity-item">No activity yet.</div>';
  openModal('detailOverlay');
}

async function saveDetailField(key, value){
  const job = jobs.find(j => j.id === detailJobId);
  if(!job) return;
  job[key] = value;
  if(key === 'assignedBy') logActivity(job, `Assigned by ${value || 'Unassigned'}`);
  if(key === 'dueDate') logActivity(job, value ? `Due date set to ${formatDate(value)}` : 'Due date cleared');
  if(key === 'notes') logActivity(job, 'Notes updated');
  await saveJobs();
  openDetail(detailJobId);
  renderBoard();
}

async function deleteJob(){
  if(!detailJobId) return;
  jobs = jobs.filter(j => j.id !== detailJobId);
  await saveJobs();
  closeModal('detailOverlay');
  renderBoard();
}

/* ---------------- CSV export ---------------- */
function exportCSV(){
  const headers = ['Job Name','Current Stage','Assigned To','Assigned By','Status','Due Date','Created','Delivered'];
  const rows = jobs.map(j => [
    j.name,
    STAGES[j.stageIndex].name,
    j.assignee || '',
    j.assignedBy || '',
    j.status,
    j.dueDate ? formatDate(j.dueDate) : '',
    j.createdAt ? new Date(j.createdAt).toLocaleDateString('en-IN') : '',
    j.deliveredAt ? new Date(j.deliveredAt).toLocaleDateString('en-IN') : ''
  ]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'jomo-production-pipeline.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- boot ---------------- */
(async function boot(){
  const savedEmail = await getSession();
  if(savedEmail){
    const users = await getUsers();
    const record = users[savedEmail];
    if(record){ await enterApp(savedEmail, record.name); return; }
  }
  showLogin();
})();
</script>
